<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <!-- Prevents iOS zoom on input focus by ensuring at least 16px text-size, but using standard scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VectorHire ATS - Recrutamento</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f4f4f5;
            /* zinc-100 */
            --bg-surface: #ffffff;
            --border-color: #e4e4e7;
            /* zinc-200 */
            --border-hover: #a1a1aa;
            /* zinc-400 */

            --text-main: #18181b;
            /* zinc-900 */
            --text-muted: #52525b;
            /* zinc-600 */
            --text-tertiary: #a1a1aa;
            /* zinc-400 */

            --primary: #000000;
            /* Preto pro design mais premium (estilo Vercel/Linear) */
            --primary-hover: #27272a;

            --success: #059669;
            /* emerald-600 */
            --success-bg: #ecfdf5;
            /* emerald-50 */
            --success-border: #a7f3d0;

            --danger: #dc2626;
            /* red-600 */
            --danger-bg: #fef2f2;
            /* red-50 */
            --danger-border: #fecaca;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem 1rem;
            /* Margens pro mobile */
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 720px;
            /* Mais estreito para leitura de uma coluna limpa */
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.025);
            padding: 2.5rem;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            margin-bottom: 2rem;
            text-align: left;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        /* Padronização mínima de 16px para inputs evita auto-zoom no iOS Safari */
        textarea {
            width: 100%;
            font-family: inherit;
            font-size: 1rem;
            /* 16px minimo */
            color: var(--text-main);
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            resize: vertical;
            transition: border-color 0.2s, box-shadow 0.2s;
            appearance: none;
            /* remove estilos padrão iOS */
        }

        textarea:focus {
            outline: none;
            border-color: var(--text-main);
            box-shadow: 0 0 0 1px var(--text-main);
        }

        textarea::placeholder {
            color: var(--text-tertiary);
        }

        /* Drag & Drop Responsivo e Clean */
        .file-upload-wrapper {
            position: relative;
            width: 100%;
            min-height: 120px;
            border: 1px dashed var(--border-hover);
            border-radius: 8px;
            background-color: #fafafa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .file-upload-wrapper:hover,
        .file-upload-wrapper.dragover {
            border-color: var(--text-main);
            background-color: var(--bg-surface);
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 10;
        }

        .file-icon {
            margin-bottom: 0.5rem;
        }

        .file-icon svg {
            width: 32px;
            height: 32px;
            color: var(--text-tertiary);
        }

        .file-upload-wrapper:hover .file-icon svg,
        .file-upload-wrapper.dragover .file-icon svg {
            color: var(--text-main);
        }

        .file-text {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .file-text span {
            font-weight: 600;
            color: var(--text-main);
            text-decoration: underline;
        }

        .selected-files {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .file-tag {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            color: var(--text-main);
        }

        .file-tag svg {
            width: 16px;
            height: 16px;
            color: var(--text-muted);
        }

        /* Botão largo para mobile touch, estilo SaaS */
        button[type="submit"] {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.875rem 1.5rem;
            /* altura touch-friendly */
            margin-top: 2rem;
            background-color: var(--primary);
            color: #ffffff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
            /* remove flash no mobile */
        }

        button[type="submit"]:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        button[type="submit"]:active:not(:disabled) {
            transform: scale(0.98);
        }

        button[type="submit"]:disabled {
            background-color: var(--border-color);
            color: var(--text-tertiary);
            cursor: not-allowed;
        }

        .btn-secondary {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.875rem 1.5rem;
            margin-top: 0.75rem;
            background-color: transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.9375rem;
            font-weight: 500;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-secondary:hover {
            background-color: var(--bg-surface);
            color: var(--danger);
            border-color: var(--danger);
        }

        /* Spinner nativo minimalista */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Container de Resultados */
        #results-container {
            margin-top: 3rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .results-header {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        /* Cards em pilha limpa - ótimo para mobile */
        .card {
            background: var(--bg-surface);
            border: 1px solid;
            border-radius: 8px;
            padding: 1.5rem;
            animation: fadeIn 0.4s ease-out backwards;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card.approved {
            border-color: var(--success-border);
            background-color: var(--success-bg);
        }

        .card.rejected {
            border-color: var(--danger-border);
            background-color: var(--danger-bg);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            /* essencial no mobile */
            gap: 0.5rem;
        }

        .card-title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-main);
            word-break: break-all;
            /* nomes de arquivo longos */
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.high {
            background-color: #d1fae5;
            color: var(--success);
        }

        .badge.low {
            background-color: #fee2e2;
            color: var(--danger);
        }

        .card-section {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .card-section label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin: 0;
        }

        .card-section p {
            font-size: 0.9375rem;
            color: var(--text-main);
            line-height: 1.6;
        }

        .verdict-box {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
        }

        .status-message {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem 0;
            font-size: 0.875rem;
        }

        /* Contact Links Row */
        .card-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border-color);
        }

        .card-links a {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.4rem 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-surface);
            color: var(--text-muted);
            font-size: 0.8125rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .card-links a:hover {
            color: var(--text-main);
            border-color: var(--text-main);
            background-color: #f4f4f5;
        }

        .card-links a svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        /* Media Queries para Mobile/Android/iOS */
        @media (max-width: 640px) {
            body {
                padding: 1rem 0;
                /* em telas pequenas, tiramos borda lateral pra usar o maximo */
                background-color: var(--bg-surface);
                /* remove contraste pro card preencher a tela */
            }

            .container {
                border: none;
                box-shadow: none;
                border-radius: 0;
                padding: 1.5rem 1rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .card-top {
                flex-direction: column;
                /* Nomes de arquivo longos nao empurram a badge SVG para fora */
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>VectorHire ATS</h1>
            <p>Triagem com IA para motor de RAG</p>
        </div>

        <form id="ats-form">
            <div class="form-group">
                <label for="job_description">Requisitos da Vaga</label>
                <textarea id="job_description" rows="4" required
                    placeholder="Descreva os requisitos técnicos, skills comportamentais e senioridade desejada..."></textarea>
            </div>

            <div class="form-group">
                <label>Currículos dos Candidatos (PDF)</label>
                <div class="file-upload-wrapper" id="drop-zone">
                    <div class="file-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="12" y1="18" x2="12" y2="12"></line>
                            <line x1="9" y1="15" x2="15" y2="15"></line>
                        </svg>
                    </div>
                    <div class="file-text">Arraste os PDFs ou <span>clique para explorar</span></div>
                    <input type="file" id="resume_files" multiple accept=".pdf" required>
                </div>
                <div class="selected-files" id="selected-files-list"></div>
            </div>

            <button type="submit" id="submit-btn" disabled>
                <span>Analisar Candidatos</span>
            </button>
            <button type="button" id="clear-btn" class="btn-secondary" style="display: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"></path>
                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                </svg>
                Limpar Memória / Nova Análise
            </button>
        </form>

        <div id="results-container"></div>
    </div>

    <script>
        const fileInput = document.getElementById('resume_files');
        const fileList = document.getElementById('selected-files-list');
        const dropZone = document.getElementById('drop-zone');

        // Drag & Drop Feedback Visual
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                updateFileList();
            }
        });

        fileInput.addEventListener('change', updateFileList);

        function checkFormValidity() {
            const btn = document.getElementById('submit-btn');
            const jobDesc = document.getElementById('job_description').value.trim();
            const hasFiles = fileInput.files.length > 0;

            if (jobDesc && hasFiles) {
                btn.disabled = false;
            } else {
                btn.disabled = true;
            }
        }

        document.getElementById('job_description').addEventListener('input', checkFormValidity);

        function updateFileList() {
            fileList.innerHTML = '';
            const files = Array.from(fileInput.files);

            checkFormValidity();

            if (files.length === 0) return;

            files.forEach(file => {
                const tag = document.createElement('div');
                tag.className = 'file-tag';
                tag.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                    <span style="flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${file.name}</span>
                    <span style="color: var(--text-tertiary); font-size: 0.75rem;">${(file.size / 1024 / 1024).toFixed(2)} MB</span>
                `;
                fileList.appendChild(tag);
            });
        }

        // Submissão do Formulário
        document.getElementById('ats-form').addEventListener('submit', async function (event) {
            event.preventDefault();

            const btn = document.getElementById('submit-btn');
            const resultsContainer = document.getElementById('results-container');
            const originalBtnText = btn.innerHTML;

            // Estado de Loading (Botão e Área de Resultados)
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div> <span>Processando IA...</span>';

            resultsContainer.innerHTML = `
                <div class="status-message">
                    Analisando documentos via RAG. Isso pode levar alguns segundos...
                </div>
            `;

            // Construir payload multipart
            const formData = new FormData();
            formData.append('job_description', document.getElementById('job_description').value);

            Array.from(fileInput.files).forEach(file => {
                formData.append('files', file);
            });

            try {
                // Preservado: Endpoint exato da request Python Original
                const response = await fetch('http://127.0.0.1:8000/api/v1/match', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Erro de rede ou backend falhou (${response.status})`);
                }

                const data = await response.json();

                // Salvar no LocalStorage
                localStorage.setItem('ats_job_description', document.getElementById('job_description').value);
                localStorage.setItem('ats_results', JSON.stringify(data.resultados));

                renderResults(data.resultados);



            } catch (error) {
                console.error("Erro no ATS:", error);
                resultsContainer.innerHTML = `
                    <div class="card rejected">
                        <div class="card-section">
                            <label>Erro de Comunicação</label>
                            <p>Falha ao conectar com o backend inteligente. Verifique se o servidor FastAPI (127.0.0.1:8000) está executando e se aceita requisições CORS.</p>
                            <p style="font-size:0.875rem; color:var(--danger); margin-top:0.5rem; word-break: break-all;">Detalhes: ${error.message}</p>
                        </div>
                    </div>`;
            } finally {
                // Volta ao normal habilitado para testar novo round (se der erro ou não, mas na prática removemos o submit button no sucesso)
                btn.disabled = false;
                btn.innerHTML = originalBtnText;
            }
        });

        // ==========================
        // RENDERIZAÇÃO DE RESULTADOS
        // ==========================
        function renderResults(resultados) {
            const resultsContainer = document.getElementById('results-container');
            resultsContainer.innerHTML = '<div class="results-header">Relatórios da Triagem</div>';

            let delayIndex = 0;

            for (const [fileName, avaliacao] of Object.entries(resultados)) {
                const isApproved = String(avaliacao.decision).toLowerCase().includes('aprovado');
                const cardClass = isApproved ? 'approved' : 'rejected';

                // Tratamento seguro caso score_fit não seja numero ou venha quebrado
                const fitScore = parseFloat(avaliacao.score_fit) || 0;
                const scoreClass = fitScore >= 70 ? 'high' : 'low';

                const iconSVG = isApproved
                    ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--success)"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>'
                    : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--danger)"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>';

                // Monta links de contato condicionalmente
                let contactLinks = '';
                if (avaliacao.github_url) {
                    const ghUrl = avaliacao.github_url.startsWith('http') ? avaliacao.github_url : `https://${avaliacao.github_url}`;
                    contactLinks += `<a href="${ghUrl}" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>GitHub</a>`;
                }
                if (avaliacao.linkedin_url) {
                    const liUrl = avaliacao.linkedin_url.startsWith('http') ? avaliacao.linkedin_url : `https://${avaliacao.linkedin_url}`;
                    contactLinks += `<a href="${liUrl}" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>LinkedIn</a>`;
                }
                if (avaliacao.email) {
                    contactLinks += `<a href="mailto:${avaliacao.email}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>${avaliacao.email}</a>`;
                }
                if (avaliacao.phone) {
                    contactLinks += `<a href="tel:${avaliacao.phone}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>${avaliacao.phone}</a>`;
                }

                const contactSection = contactLinks
                    ? `<div class="card-links">${contactLinks}</div>`
                    : '';

                const cardHTML = `
                    <div class="card ${cardClass}" style="animation-delay: ${delayIndex * 0.1}s">
                        <div class="card-top">
                            <span class="card-title">${fileName}</span>
                            <span class="badge ${scoreClass}">Match: ${fitScore}%</span>
                        </div>
                        
                        <div class="card-section">
                            <label>Veredito da IA</label>
                            <div class="verdict-box">
                                ${iconSVG}
                                ${avaliacao.decision}
                            </div>
                        </div>
                        
                        <div class="card-section">
                            <label>Comentários Técnicos</label>
                            <p>${avaliacao.technical_justification}</p>
                        </div>

                        ${contactSection}
                    </div>
                `;
                resultsContainer.innerHTML += cardHTML;
                delayIndex++;
            }

            if (Object.keys(resultados).length === 0) {
                resultsContainer.innerHTML += '<div class="status-message">Nenhum resultado recebido do processamento.</div>';
            }
        }

        // ==========================
        // LOCAL STORAGE & CLEAR LOGIC
        // ==========================
        document.addEventListener('DOMContentLoaded', () => {
            const savedJob = localStorage.getItem('ats_job_description');
            const savedResults = localStorage.getItem('ats_results');

            if (savedJob && savedResults) {
                document.getElementById('job_description').value = savedJob;

                try {
                    const parsedResults = JSON.parse(savedResults);
                    renderResults(parsedResults);

                    document.getElementById('clear-btn').style.display = 'flex';
                    document.getElementById('submit-btn').style.display = 'none';
                } catch (e) {
                    console.error("Erro ao carregar resultados salvos da memoria", e);
                }
            }
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            // Limpa memoria
            localStorage.removeItem('ats_job_description');
            localStorage.removeItem('ats_results');

            // Limpa UI
            document.getElementById('ats-form').reset();
            document.getElementById('job_description').value = '';
            document.getElementById('results-container').innerHTML = '';
            fileList.innerHTML = '';

            // Reseta botoes
            document.getElementById('clear-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'flex';
            document.getElementById('submit-btn').disabled = true;
        });
    </script>
</body>

</html>
